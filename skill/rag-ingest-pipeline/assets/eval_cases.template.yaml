# ============================================================
# 召回评测集（质检尺）：每次改切片参数/换模型后跑 eval 防回归
# 生成方法：让 AI 抽读 10-20 个样例 chunk → 按"用户真会怎么问"提案 10-15 条
#          → 人工确认期望关键词 → 落到本文件。expect 命中规则满足即算答案。
# ============================================================
cases:
  - query: （用户真会问的问题，含口语化表述）
    expect_text: [答案块里必然出现的关键词或产品名]
  - query: 精确编码/型号类问题示例
    where:                      # 精确值类查询走元数据过滤(需配合 config 的 extract_rules)
      sku_code: "123456789"
    expect_text: [目标块关键词]
  - query: 已知检索器做不到的问题(文档化限制)
    expect_text: [永远不会命中的词]
    xfail: true                 # 期望失败：失败=基线通过，反而命中说明限制已消除
